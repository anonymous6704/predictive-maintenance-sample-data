# Block YAML written with LF newlines.
datasets:
  azure: true
  cmapss_fd001: true
  cmapss_fd002: true
  cmapss_fd003: true
  cmapss_fd004: true
  scania: true

data_build:
  sequence_length: 20
  stride: 5
  max_anchors_per_unit: 500
  censoring_rates:
    - 0.0
    - 0.1
    - 0.3
    - 0.5
  output_format: npz
  force_rebuild: false
  allow_synthetic_fallback: false
  allow_short_sequences: false
  horizons:
    - 24
    - 72
    - 168
    - 336

censoring_rates_by_dataset:
  azure:
    - 0.0
  scania:
    - 0.0
  cmapss_fd001:
    - 0.0
    - 0.1
    - 0.3
    - 0.5
  cmapss_fd002:
    - 0.0
    - 0.1
    - 0.3
    - 0.5
  cmapss_fd003:
    - 0.0
    - 0.1
    - 0.3
    - 0.5
  cmapss_fd004:
    - 0.0
    - 0.1
    - 0.3
    - 0.5

raw_roots:
  - raw

notes:
  source_config: "Exported from the main project's configs/main.yaml data_build section."
  scania: "scania means SCANIA Component X-derived survival/time-series CSV inputs, not UCI APS."

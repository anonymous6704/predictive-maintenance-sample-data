datasets:
  scania: true

data_build:
  sequence_length: 20
  stride: 5
  max_anchors_per_unit: 500
  censoring_rates:
    - 0.0
  output_format: npz
  force_rebuild: false
  allow_synthetic_fallback: false
  allow_short_sequences: false
  horizons:
    - 24
    - 72
    - 168
    - 336

censoring_rates_by_dataset:
  scania:
    - 0.0

raw_roots:
  - raw

notes:
  source: "SCANIA Component X-derived survival/time-series CSV inputs only; UCI APS is not accepted."
